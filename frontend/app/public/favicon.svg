<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.5 -2 25 25" role="img" aria-label="VisionSet">
  <!--
    (No double hyphen anywhere in this comment: XML forbids it, and the browser
    then refuses the whole icon.)

    The VisionSet icon — the same block mark the rail draws (`src/shell/Brand.tsx`),
    centred in a square so a browser tab does not stretch it.

    `#f5580b` is the brand token, oklch(0.663 0.205 39.9), in sRGB: a
    favicon is a static file a browser loads outside the page, so it cannot read
    the CSS variable, and hex is what every tab strip renders reliably.

    An SVG rather than an `.ico`: `tests/architecture/test_tracked_file_sizes.py`
    exists to keep binaries out of the repository, and a text asset does not need
    an exemption to be argued.
  -->
  <path d="M16 0V5.25H10.666V10.5H0L0 5.25H5.334V0L16 0ZM16 10.5V15.75H10.666V10.5H16ZM10.666 15.75V21H0L0 15.75H10.666Z" fill="#f5580b"/>
</svg>
