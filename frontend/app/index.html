<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Without this a browser asks for `/favicon.ico` unprompted, which lands
      on the API root and is correctly answered 404 — the only console error in an
      otherwise clean load, and a console that always has a line in it is worth
      less than one that is empty when things are fine.

      Written root-relative and **not** as a literal `/app/…`: Vite rewrites asset
      URLs in this document with the configured `base`, which is `/app/` for a build
      and `/` for `vite dev`. Hardcoding the prefix would break the dev server, and
      hardcoding nothing would break the wheel. Both halves are asserted —
      `tests/scripts/favicon.test.mjs` reads the built `dist/index.html`, and the
      browser cycle loads the real server and asserts a clean console.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Robomous VisionSet</title>
    <!--
      The theme before the first paint: the module entry is deferred, so without
      this a dark page would paint light first. `startTheme` in ui-core's
      `lib/theme.ts` takes over from it; `src/prePaint.test.ts` holds the two to
      the same answers.
    -->
    <script data-theme-pre-paint>
      (function () {
        var preference = null;
        try {
          preference = localStorage.getItem("visionset.prefs.theme");
        } catch (e) {}
        var dark =
          preference === "dark" ||
          (preference !== "light" &&
            typeof matchMedia === "function" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
