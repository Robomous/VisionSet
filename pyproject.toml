[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visionset"
dynamic = ["version"]
description = "Open-source, local-first tool for creating, curating, and versioning computer-vision training datasets — with a Physical AI roadmap."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Robomous Inc." }]
keywords = ["computer-vision", "datasets", "annotation", "labeling", "physical-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "typer>=0.12",
    "mcp>=2.0.0",
    "sqlalchemy>=2.0",
    # Image decoding for the media processor (#16). A third-party library, not a framework,
    # so it is allowed inside kernel/adapters/ and needs no import-linter change. The 11.0
    # floor is the first release with Python 3.13 wheels, which the classifiers promise.
    "pillow>=11.0",
    # HEIC/HEIF decoding, registered as a Pillow plugin inside kernel/adapters/ —
    # the same third-party-library allowance pillow has. Core rather than an
    # extra: phone photos are a first-contact input, and an ingest that refuses
    # them until a second install is a broken first run.
    "pillow-heif>=1.5.0",
    # Settings for the embedded job executor (#328). The first pydantic-settings
    # use in this repository; `server/settings.py` argues why the executor is what
    # finally earned one, and why the four existing bare `os.environ` reads stay
    # where they are. Installed already as a transitive dependency of nothing —
    # this one is genuinely new — but it is pydantic's own companion package and
    # pydantic 2 is already a hard runtime dependency.
    "pydantic-settings>=2.4",
    # Multipart parsing for the upload routes (#28). FastAPI requires it for
    # `UploadFile` and raises at import time without it. It is already installed
    # here as a transitive dependency of `mcp` — which is exactly why it is
    # declared: an upload surface resting on somebody else's dependency tree
    # breaks the day that tree changes.
    "python-multipart>=0.0.9",
    # Version specifiers, for the check that decides whether an installed provider
    # plugin was built for this VisionSet. A plugin states its compatibility as an
    # ordinary dependency pin, so reading it means parsing a requirement and
    # testing a specifier — including against a pre-release, which is what this
    # project's own version is and what a hand-rolled comparison gets wrong first.
    # Installed here already as a transitive dependency, which is exactly why it is
    # declared: a compatibility gate resting on somebody else's dependency tree
    # breaks the day that tree changes.
    "packaging>=24.0",
]

# The runtime for `local`-type inference connections (#418). An **extra**, not a
# dependency group: a group is for developing this repository, and this is
# something a user installs — `pip install "visionset[local-inference]"`, the
# exact command `visionset/inference/_extra.py` puts in its refusal message.
#
# It is the runtime for connections that run a model *here*, and not the
# auto-labeling feature, which is always present. A base install can create a
# local connection, list it, and be told precisely what to install; what it
# cannot do is fetch weights or run a forward pass.
#
# Roughly two gigabytes of CUDA wheels, which is the whole reason it is optional
# and the reason `visionset/inference` defers every one of these imports into a
# function: `visionset.jobs` is imported at server startup and at every worker
# spawn, so a module-level `import torch` would make this mandatory in practice
# while remaining optional in the metadata.
#
# The canonical spelling is `local-inference`; it supersedes the earlier
# `autolabel` framing. Version floors rather than pins: this is a user's
# environment and their CUDA build decides most of it. `uv.lock` does record the
# extra — once as a member list, once per member under `requires-dist` — so
# editing these lines without re-running `uv lock` leaves it stale and
# `uv lock --check` fails on the result. What a plain `uv sync` does not do is
# *install* it: that takes `--extra local-inference`, which is how two gigabytes
# of CUDA wheels stay out of a developer's environment by default.
#
# `torchvision` is here because SAM 2's image processor imports it, and nothing
# else in this list brings it: `Sam2ImageProcessor` refuses to construct without
# it, so the point-prompt adapter could not load a processor at all on an
# environment carrying the extra exactly as it used to be declared (#457). No
# code in this repository imports it — it is a dependency of the runtime rather
# than of the product, which is why it is declared here and nowhere else.
#
# Its floor is `torch`'s floor, restated: torchvision pins torch *exactly*
# (0.19.0 requires `torch==2.4.0`, 0.28.0 requires `torch==2.13.0`), so the pair
# has to move together or a resolver is handed two floors it cannot satisfy at
# once. Whichever one it picks, it decides the other.
[project.optional-dependencies]
local-inference = [
    "torch>=2.4",
    "torchvision>=0.19",
    # 5.0 is where `sam3` and `sam3_tracker` arrive, measured against the wheels
    # rather than inferred from a changelog: 4.57.6 ships neither module and 5.0.0
    # ships both, exporting `Sam3TrackerProcessor` and `Sam3TrackerModel` at the
    # top level, which is what `sam_provider` names. It is a major bump for
    # everybody, including the SAM 2 and Grounding DINO users who gain nothing
    # from it — and it makes the floor honest rather than raising it. `uv.lock`
    # has resolved 5.x for as long as this extra has existed, so `>=4.44` was a
    # compatibility claim no run has ever tested.
    "transformers>=5.0",
    "accelerate>=0.33",
    "huggingface-hub>=0.24",
]

[project.urls]
Homepage = "https://github.com/Robomous/VisionSet"
Issues = "https://github.com/Robomous/VisionSet/issues"

[project.scripts]
visionset = "visionset.cli.main:app"

# Importer/exporter plugin discovery. Third-party distributions (e.g. a
# `visionset-format-x` package) register their plugins in this same group.
[project.entry-points."visionset.formats"]
dummy = "visionset.formats._dummy:DummyExporter"
ultralytics = "visionset.formats.ultralytics:UltralyticsExporter"
yolov5-yaml = "visionset.formats.yolov5_yaml:Yolov5YamlExporter"
coco = "visionset.formats.coco:CocoExporter"
voc = "visionset.formats.voc:VocExporter"
# The one format whose content is tags. One row per (image, tag), so a
# multi-tagged image is written once and listed once per tag.
classification = "visionset.formats.classification:ClassificationExporter"
# The lane family (#223). Five plugins over v1's six exporter functions: CULane's
# annotation file and its segmentation mask are two artifacts of one format.
tusimple = "visionset.formats.lanes:TuSimpleExporter"
curvelanes = "visionset.formats.lanes:CurveLanesExporter"
bdd100k-lane = "visionset.formats.lanes:Bdd100kLaneExporter"
culane = "visionset.formats.lanes:CuLaneExporter"
openlane-2d = "visionset.formats.lanes:OpenLane2dExporter"

# Inference driver discovery. A third-party distribution registers its own
# provider in this same group, and pins the VisionSet it was built for in its
# ordinary `dependencies` — discovery reads that pin and skips a mismatch.
# The pixel side of a pre-processing recipe, one driver per step kind. Discovered
# the way exporters are, so a distribution can register a driver for a kind the
# built-ins do not apply.
[project.entry-points."visionset.preprocessing"]
pillow-resize = "visionset.preprocessing.pillow:PillowResizeDriver"
pillow-augment = "visionset.preprocessing.pillow:PillowAugmentDriver"

[project.entry-points."visionset.providers"]
sam = "visionset.inference.sam_provider:SamProvider"
grounding-dino = "visionset.inference.transformers_provider:GroundingDinoProvider"
stub = "visionset.inference.stub_provider:StubProvider"
http = "visionset.inference.http_provider:HttpProvider"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    # The MCP tests drive the real protocol through an in-memory client session,
    # which is async; `anyio.run` is the bridge that keeps every test a plain
    # sync function and the suite free of a pytest asyncio plugin. Installed
    # already as a transitive dependency of `mcp`, `httpx` and `starlette` —
    # which is exactly why it is declared, the `python-multipart` reason.
    "anyio>=4.5",
    "ruff>=0.16.1",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pytest-xdist>=3.8.0",
]

# The tool the YOLO exporter exists to feed, used by one smoke test (#62) and
# deliberately NOT in `dev`: it brings torch, so it is roughly two gigabytes in
# front of every `uv sync`. CI installs this group in its own job and sets
# VISIONSET_REQUIRE_ULTRALYTICS=1, which turns the local skip into an error —
# the ffmpeg rule from #22, for its reason.
yolo = [
    "ultralytics>=8.3",
]

# The reference reader for the COCO exporter (#63). Its own group beside `yolo`
# for the same reason, and installed in the same CI job.
coco = [
    "pycocotools>=2.0",
]

# --- Version: single source of truth is the repo-root VERSION file ---
[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = "^(?P<version>[^\\s]+)"

# The compiled UI bundle in _static/ is git-ignored but must ship in the wheel:
# `artifacts` overrides gitignore-based exclusion during builds.
[tool.hatch.build]
artifacts = ["src/visionset/_static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/visionset"]

# --- Ruff ---
[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# --- Mypy: strict on the kernel, normal elsewhere ---
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# pillow-heif publishes no py.typed marker, so the one symbol imported from it
# (register_heif_opener) arrives untyped.
module = "pillow_heif.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "visionset.kernel.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Puts the repo root on sys.path so `tests.fixtures.media` resolves as a namespace package.
# The alternative — `tests/__init__.py` — would change how every existing test module is
# named, for no gain.
pythonpath = ["."]

# --- Import Linter: the kernel boundary is machine-enforced ---
[tool.importlinter]
root_package = "visionset"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Kernel purity: no delivery mechanisms or frameworks inside the kernel"
type = "forbidden"
source_modules = ["visionset.kernel"]
forbidden_modules = [
    "visionset.server",
    "visionset.cli",
    "visionset.mcp",
    "visionset.formats",
    # The JSON shapes the surfaces publish. Not a delivery mechanism, but the same
    # direction: it is written in terms of domain models, so the kernel importing
    # it would close a loop and make a publication decision reachable from the
    # place that decides what exists.
    "visionset.wire",
    # The background handlers and the dispatcher. Same direction again, and this
    # one is load-bearing rather than tidy: a handler resolves a format plugin, so
    # `visionset.jobs` imports `visionset.formats` — and a kernel that could reach
    # a handler could reach a plugin through it, which is the wall contract 1
    # exists to hold. It is also what keeps `SqliteJobQueue` unable to resolve a
    # job type, which is why `UnknownJobType` is raised outside the kernel.
    "visionset.jobs",
    # The composition root that turns a connection row into a running model
    # (#418). Same direction as the three above, and load-bearing for the same
    # kind of reason: it is where torch and transformers are reached, so a kernel
    # that could import it could import them — and `ModelProvider` would stop
    # being a port describing a protocol and start being a description of one
    # implementation. The kernel knows the configuration and the protocol; what
    # runs is on the other side of this line.
    "visionset.inference",
    # The pre-processing driver registry and the Pillow drivers behind the
    # `PreprocessingDriver` port. Same direction as `visionset.formats`: the kernel
    # takes driver instances, and discovery stays on the other side of the line.
    "visionset.preprocessing",
    "fastapi",
    "typer",
    "mcp",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Delivery clients are siblings: server, cli and mcp never import each other"
type = "independence"
modules = ["visionset.server", "visionset.cli", "visionset.mcp"]

# A handler runs in a worker process that `spawn` started with nothing loaded, and
# it imports whatever it names. If it named `visionset.server`, the child would
# re-execute that module's `app = create_app()` and build a second application —
# with its own workspace handle and its own dispatcher — inside a worker. The
# other two are forbidden for the ordinary reason: a handler is below the
# surfaces, so nothing it does may depend on which one asked.
[[tool.importlinter.contracts]]
name = "Job handlers are below the surfaces: visionset.jobs imports no delivery package"
type = "forbidden"
source_modules = ["visionset.jobs"]
forbidden_modules = [
    "visionset.server",
    "visionset.cli",
    "visionset.mcp",
    "fastapi",
    "typer",
    "uvicorn",
]

# The composition root for inference, one package below the three surfaces and
# beside `formats`, `wire` and `jobs`. Forbidden from `visionset.jobs` as well as
# from the delivery packages, and that one is not tidiness: the download handler
# imports *this*, so the reverse would close a cycle — and would put the optional
# runtime back on the path a worker takes at spawn, which is exactly what
# deferring every heavy import into a function exists to prevent.
[[tool.importlinter.contracts]]
name = "Inference adapters are below the surfaces: visionset.inference imports no delivery package"
type = "forbidden"
source_modules = ["visionset.inference"]
forbidden_modules = [
    "visionset.server",
    "visionset.cli",
    "visionset.mcp",
    "visionset.jobs",
    "fastapi",
    "typer",
    "uvicorn",
]
