# Upload the one artifact VisionSet ships — the wheel with the compiled UI inside
# it — to PyPI, over trusted publishing.
#
# `bash scripts/build_dist.sh` is mandatory and a bare `uv build` (or
# `python -m build`) is wrong. `uv build` copies `src/visionset/_static/` as
# package data at the moment it runs, so a wheel built before `pnpm bundle:static`
# ships the two placeholder files and nothing else — and it installs, and it
# starts, and `/app/` answers 404 naming a script the user cannot run. The script
# is the ordering, plus a check after each step. Everything up to and including
# that line is the `wheel` job in ci.yml, step for step and action version for
# action version, which is what makes a green `wheel (build, install, serve)`
# check evidence that this workflow's build half works. The versions still match;
# only the spelling differs, because every `uses:` here is pinned to a commit for
# the reason given at the `steps:` block below. A bump must move both files.
#
# No credentials anywhere: `id-token: write` plus the `pypi` environment is what
# PyPI's trusted publisher exchanges for a short-lived upload token. The workflow
# **filename** and the environment name are both part of that configuration on
# PyPI's side — renaming either breaks the exchange with an opaque error, not a
# missing-file error.
name: Publish to PyPI

# Manual only, for now. The first run claims the `visionset` name and converts
# PyPI's pending publisher into a real one. This moves to a release/tag trigger
# once the versioning cadence is settled.
#
# Being dispatch-only, it never reports on a pull request — so it must never be
# added to `main`'s required-checks ruleset. A required check that never reports
# leaves every pull request BLOCKED forever with nothing red to read.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # A `permissions:` block sets every scope it does not name to `none`, and
      # `actions/checkout` authenticates with GITHUB_TOKEN — hence `contents`.
      contents: read
      id-token: write
    # Every `uses:` in this job is pinned to a commit, and this is the one job in
    # the repository where that is worth the friction. `id-token: write` is a job
    # scope, not a step scope: any step here can ask GitHub for an OIDC token and
    # trade it with PyPI for an upload credential for the `visionset` name. A tag
    # and a branch are both mutable — `v7` and `release/v1` are pointers their
    # owners can move, and a mover who is not their owner is exactly the
    # supply-chain compromise this is for. A commit cannot be moved.
    #
    # ci.yml is deliberately left on tags: it holds no secrets and its token is
    # `contents: read`, so the same pin would buy little and cost every action
    # bump a hand-resolved digest. Dependabot's `github-actions` ecosystem updates
    # a pinned digest and the version comment beside it together, so the
    # three-day cool-down in .github/dependabot.yml still governs these five.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Nothing is pushed back from here — the wheel leaves over PyPI's API, not
        # over git — so the token has no reason to stay in `.git/config` while
        # `build_dist.sh` runs the frontend build and a freshly resolved backend.
        with:
          persist-credentials: false

      # reads packageManager from package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the wheel and sdist
        run: bash scripts/build_dist.sh

      # No `with:` — no credentials by design, and the action's default
      # `packages-dir` is `dist/`, which `build_dist.sh` empties before `uv build`
      # so both files there are from this run.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
