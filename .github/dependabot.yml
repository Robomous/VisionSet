# Automated dependency updates.
#
# Five ecosystems, six entries:
#   uv             — the single `visionset` distribution (pyproject.toml + uv.lock)
#   npm            — the pnpm workspace (pnpm-lock.yaml at the root, packages in frontend/*)
#   npm            — the documentation site (docs/, its own workspace root and lockfile)
#   github-actions — .github/workflows/
#   docker         — the three dev-stack images (docker/*.Dockerfile)
#   docker-compose — the services docker/compose.yaml pulls rather than builds
#
# `cooldown` is a supply-chain margin: a version must have been published more
# than three days ago before Dependabot will propose it, so a package that is
# compromised and yanked shortly after release never reaches a PR here. It
# applies to *version* updates only — Dependabot security updates stay
# immediate by design, which is what we want.
#
# **Three days is one number with several spellings, and they must agree.** The
# same rule governs the versions a person or a CI step picks, where Dependabot is
# not involved at all: `minimumReleaseAge` in pnpm-workspace.yaml covers every
# `pnpm add`, and scripts/cooldown.sh covers uv, which has no equivalent setting.
# `tests/scripts/cooldown.test.mjs` holds all three to each other, so moving one
# and forgetting the others is a red test rather than a quiet inconsistency.
#
# `ignore` is for a version this repository cannot take *yet* — a major whose
# ecosystem has not caught up. Every entry must name the blocker and the
# condition that retires it, because an ignore with no expiry is a pin nobody
# remembers choosing. The uv ecosystem has no such entry: nothing on the Python
# side is held back today, and inventing a rule with no blocker behind it would
# be exactly that unowned pin.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      backend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "backend"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is the native port, released from microsoft/typescript-go;
      # it is `latest` on npm, so Dependabot is right to offer it and no setting
      # would hold it back. Two dev toolchains refuse it and neither has any
      # release that supports it: typescript-eslint hard-errors
      # "typescript-eslint does not support TS 7.0." and declares
      # `typescript: ">=4.8.4 <6.1.0"`, and openapi-typescript crashes on
      # `ts.factory.createKeywordTypeNode`, which breaks the generated-client
      # drift gate. Taking 7 behind two separate TS-5 pins would make the repo
      # read as "on TypeScript 7" while both gates policing it still ran 5.x.
      #
      # Remove this the day typescript-eslint ships a TS 7 line. This repository
      # is on 6.0.3, which is the last version both toolchains accept, and the
      # two changes 6.0 required — an explicit `rootDir` and an explicit `types`
      # list, both now committed — are the same ones 7 wants. See #264.
      - dependency-name: "typescript"
        versions: [">= 7"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "frontend"]

  # The documentation site, which keeps its own lockfile because `docs/` is its
  # own pnpm workspace root — see docs/pnpm-workspace.yaml for why it is not a
  # member of the frontend workspace. Dependabot reads one lockfile per entry, so
  # without this one Astro and Starlight would be the only npm dependencies here
  # with no automation and no cool-down.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      docs-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "docs"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]

  # The base images of the three dev-stack builds — `node:24-bookworm-slim`, twice,
  # and `ghcr.io/astral-sh/uv:python3.12-trixie-slim`. Until this entry existed they
  # were the one class of dependency here with no automation and no cool-down at
  # all: a tag is re-pointed by its publisher, so `node:24-bookworm-slim` means
  # different bytes on different days and nothing in the repository recorded
  # which. Dependabot cannot fix the re-pointing, but it can propose the version
  # bumps, and the same three days apply.
  #
  # Both Dockerfiles pin a major-and-flavour tag rather than a digest, which is
  # the deliberate trade docker/api.Dockerfile's header argues for (the ffmpeg
  # version that comes with the distribution is the thing being chosen). A digest
  # pin would be stricter and would also make every security patch a manual bump.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      images-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Node 25 is the odd-numbered *current* line; 24 is the active LTS, and
      # this repository is on 24 in ten places — `docker/app.Dockerfile` and
      # `docker/docs.Dockerfile` plus eight `node-version: 24` pins across ci.yml
      # and publish-pypi.yml. Taking a major here alone would put the dev
      # containers on a different major than every job that tests the code and the
      # job that publishes it, and CI could not tell: the `dev image` job builds
      # `docker/api.Dockerfile` only, so nothing in the required checks ever builds
      # either of the node images. That is what made #403 green while proving
      # nothing about node 25.
      #
      # Remove this the day the next even-numbered line enters LTS, and take it
      # in one PR that moves all ten pins together.
      - dependency-name: "node"
        versions: [">= 25"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]

  # The services compose *pulls* rather than builds: nginx, postgres, minio. A
  # separate ecosystem from the one above because Dependabot reads Dockerfiles and
  # compose files with different parsers, and an entry for one does not see the
  # other.
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      services-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
