packages:
  - "frontend/*"

# The dependency cool-down, Node's half. See scripts/cooldown.sh for the rule and
# the argument; this is the same three days, in the units pnpm wants (minutes).
#
# Declarative rather than a wrapper, because pnpm has the setting uv does not:
# it applies to every `pnpm add` and `pnpm update` on a laptop, in
# docker/app.Dockerfile — which copies this file, so the image inherits it — and
# in CI, with nothing to remember and no flag to forget.
#
# It is a *resolution*-time rule and is inert under `--frozen-lockfile`, which is
# what every automated install here uses. That is deliberate: the lockfile is the
# reviewed artifact, and re-litigating it at install time would only mean CI
# stopped testing the pinned set.
#
# What it feels like when it fires: `pnpm add <pkg>` with no range asks for
# `latest`, so if the newest release is younger than this, pnpm refuses outright
# with ERR_PNPM_NO_MATURE_MATCHING_VERSION rather than quietly picking an older
# one. That is the intended answer — wait, or name an older version explicitly.
# To take a young version deliberately, add it to `minimumReleaseAgeExclude`
# below in the same commit, so the exception is reviewable.
minimumReleaseAge: 4320

# Packages allowed to skip the wait. Empty, and a new entry should say why in the
# commit that adds it — an exclusion with no stated reason is a cool-down quietly
# switched off for one package.
minimumReleaseAgeExclude:
  # First-party package, released from our own CI minutes before it is
  # consumed here — the supply-chain cool-down guards third-party releases.
  - "@robomous/ui-core"

# Packages permitted to run an install script. pnpm runs none by default, because a
# postinstall is arbitrary code executing with your credentials at install time —
# the cool-down above buys time to notice a bad release, and this decides which
# releases get to run anything at all.
#
# esbuild's postinstall fetches the platform binary for the machine doing the
# install. Without it `vite` and `vitest` have no binary to call, and every frontend
# build and test fails at startup rather than at resolution.
#
# protobufjs arrives under onnxruntime-web. Its postinstall only compares the range a
# dependent declared against its own versioning scheme and prints a warning; it writes
# nothing and generates nothing, so declining it costs the build nothing. The entry
# exists because pnpm requires the answer to be recorded, not because there was a
# question about whether to run it.
allowBuilds:
  esbuild: true
  protobufjs: false

# Forced resolutions. An entry here is a version this repository takes regardless of
# what the dependency graph asked for, so each one should say why it exists.
#
# js-yaml: a published security advisory, reached transitively. The override is what
# makes the fix reach every consumer of it in the tree rather than only the one that
# happened to be updated.
overrides:
  js-yaml@4.3.0: 4.3.2
