# GPU inference for the dev stack (development only):
#
#   docker compose -f docker/compose.yaml -f docker/compose.gpu.yaml up --build
#
# An override file rather than a profile: a profile adds whole services and cannot amend
# `api`; a second `-f` merges into it. `--build` on every switch between modes, or Compose
# reuses whichever api image it already has.
#
# Needs the NVIDIA Container Toolkit on the host (`docker info --format '{{json
# .Runtimes}}'` names `nvidia`). Without it `up` fails at container creation with
# `could not select device driver "nvidia"`.

services:
  api:
    build:
      dockerfile: docker/api-gpu.Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            # Honoured by plain `docker compose up` despite living under `deploy:`.
            # `count: all` so the file fits any workstation; pin with `device_ids: ["0"]`.
            - driver: nvidia
              count: all
              capabilities: [gpu]
