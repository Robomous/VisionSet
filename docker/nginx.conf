# The dev stack's front door. Dev only: in production `visionset server` serves the API
# and the bundle from one process, with no proxy.

events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # One line per request; `$upstream_addr` tells "the app answered 404" from "nginx could
  # not reach the app".
  log_format dev '$remote_addr $request -> $status via $upstream_addr';
  access_log /dev/stdout dev;
  error_log  /dev/stderr warn;

  # Docker's DNS, with the upstreams in variables, so nginx re-resolves: a literal
  # `proxy_pass` caches the address at startup and 502s after a recreated container.
  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    listen 80;
    server_name _;

    # Uploads send whole files; the 1m default 413s before the API sees anything.
    client_max_body_size 0;

    location /api/ {
      set $api http://api:8000;
      # The API owns its root: /api/projects → /projects. `rewrite … break` because a
      # trailing slash on proxy_pass is unavailable once the upstream is a variable.
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # An ingest or export can run far longer than the 60s default.
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;

      # Downloads are streamed by the API on purpose.
      proxy_buffering off;
    }

    location / {
      set $app http://app:5173;
      proxy_pass $app;

      # `localhost`, not `$host`: vite rejects any Host it does not recognise
      # (DNS-rebinding protection), so forwarding the client's would 403 every name but
      # localhost. HMR is unaffected; the client builds its socket URL from `location`.
      proxy_set_header Host              localhost;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # HMR is a WebSocket; without the upgrade the app loads and edits never arrive.
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      # An idle HMR socket must not be closed at the 60s default.
      proxy_read_timeout 86400s;
    }
  }
}
