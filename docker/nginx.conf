# The dev stack's one entry point. Everything the browser asks for arrives here.
#
# Dev only. In production there is no proxy and no second origin: the wheel's
# `visionset ui` serves the API at the root and the compiled bundle at /ui, from
# one uvicorn process. Nothing in this file describes how VisionSet is deployed.

events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Terse, one line per request, and to stdout so `docker compose logs nginx`
  # shows the routing. `$upstream_addr` is the useful column here — it is how you
  # tell "the app answered 404" from "nginx could not reach the app at all".
  log_format dev '$remote_addr $request -> $status via $upstream_addr';
  access_log /dev/stdout dev;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS. Naming it, and passing the upstream through a
  # variable, is what makes nginx re-resolve: with a literal `proxy_pass
  # http://api:8000` it resolves once at startup and caches forever, so
  # `docker compose up -d --force-recreate api` — which can hand the container a
  # new address — leaves nginx proxying to an address nobody is listening on,
  # answering 502 until it is restarted too.
  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    # Published as 8080 on the host; see docker/compose.yaml.
    listen 80;
    server_name _;

    # Uploads. `POST /sources/images` sends whole image files, and nginx's
    # default cap is 1m — small enough that a handful of ordinary photographs
    # fails with a 413 that never reaches the API, so nothing appears in its log
    # and the browser reports an error the backend never saw. 0 disables the
    # check and leaves the limit to the thing that actually knows one.
    client_max_body_size 0;

    location /api/ {
      set $api http://api:8000;
      # Strip the prefix: the app asks for `/api/projects` because in dev it is
      # not same-origin with the API, but the API's own route is `/projects` —
      # it owns its root. `rewrite ... break` rather than a trailing slash on
      # proxy_pass, which is not available once the upstream is a variable.
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # An ingest or an export is synchronous and can run far longer than the
      # 60s default, which would otherwise surface as a 504 while the work
      # carries on and completes invisibly.
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;

      # Downloads (asset content, thumbnails, manifests, export archives) are
      # streamed by the API on purpose — buffering them here would put the whole
      # archive in nginx's memory or its spool directory first.
      proxy_buffering off;
    }

    location / {
      set $app http://app:5173;
      proxy_pass $app;

      # `localhost`, not `$host`, and this one is not cosmetic. Vite refuses a
      # request whose Host it does not recognise — DNS-rebinding protection — and
      # its allow-list is localhost and bare IP literals. Forwarding the client's
      # own Host therefore works from http://localhost:8080 and answers
      #   403 Blocked request. This host ("…") is not allowed
      # for every other name the proxy might be reached by: a machine hostname, a
      # `.local` address, an entry somebody put in /etc/hosts. Naming a host vite
      # trusts makes the front door work by whatever name you arrive at it, and
      # keeps the decision here rather than weakening the app's own dev config —
      # which is shared with everyone running vite directly on their machine.
      #
      # HMR is unaffected: the browser's client builds its WebSocket URL from
      # `location`, not from anything the server echoes back.
      proxy_set_header Host              localhost;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Hot module reload is a WebSocket, and vite's client opens it against the
      # page's own origin — which is this proxy, not the dev server. Without
      # these three lines the app still loads and still works, and edits simply
      # never reach the browser: the failure looks like a broken watcher rather
      # than a missing upgrade, which is why it is worth stating.
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      # A dev server that is idle between edits must not have its HMR socket
      # closed at nginx's 60s default.
      proxy_read_timeout 86400s;
    }
  }
}
