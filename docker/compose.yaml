# Development stack only — the release artifact is the pip package.
#
#   docker compose -f docker/compose.yaml up                                               # base
#   docker compose -f docker/compose.yaml -f docker/compose.gpu.yaml up --build            # + GPU inference
#   docker compose -f docker/compose.yaml -f docker/compose.cpu-inference.yaml up --build  # + CPU inference
#   docker compose -f docker/compose.yaml --profile postgres up                            # unused extras
#
#   App   http://localhost:8080   nginx: /api/ → api, everything else → vite
#   Docs  http://localhost:4321
#
# Everything installs at build time, nothing at run time. After a dependency, manifest,
# config or Dockerfile change: `docker compose -f docker/compose.yaml build`. Source
# reloads live: src/visionset (uvicorn --reload), frontend/*/src (vite + tsc --watch),
# docs/content and docs/src (astro dev). nginx.conf needs `up --force-recreate nginx`,
# an entry script needs `restart`.
#
# Data lives in ./workspace-data (git-ignored) or wherever VISIONSET_DATA points, and
# survives `down -v`. A workspace older than the current schema is refused: delete it.
#
# Containers run as VISIONSET_UID:VISIONSET_GID (default 1000:1000) so bind mounts stay
# yours. If that is not your id, then `--build`:
#   printf 'VISIONSET_UID=%s\nVISIONSET_GID=%s\n' "$(id -u)" "$(id -g)" > docker/.env
# Rootless Docker: set both to 0. macOS/Windows: leave the defaults.

# Not the directory name (`docker`), which any other checkout would share.
name: visionset

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      args:
        VISIONSET_UID: ${VISIONSET_UID:-1000}
        VISIONSET_GID: ${VISIONSET_GID:-1000}
    working_dir: /workspace
    # Not `${UID}`: no shell exports it, so the service would silently run as root.
    user: "${VISIONSET_UID:-1000}:${VISIONSET_GID:-1000}"
    volumes:
      - ../src:/workspace/src
      - ../docker:/workspace/docker:ro
      - ${VISIONSET_DATA:-../workspace-data}:/data
    environment:
      # Created by docker/api-dev.sh on first boot.
      VISIONSET_WORKSPACE: /data/dev
      # Sign the browser in without a token. `auto` only trusts a loopback peer, and
      # behind nginx the peer is never loopback. With the front door on every interface
      # this trusts the whole network; set `never` on one you do not trust.
      VISIONSET_UI_SESSION: always
      # For gated model weights; empty means no token.
      HF_TOKEN: ${HF_TOKEN:-}
    # Raw uvicorn rather than `visionset server`, which would also serve the compiled
    # bundle that vite replaces here.
    command: sh /workspace/docker/api-dev.sh
    ports:
      # Loopback only: nginx and docs are the doors to the network.
      - "127.0.0.1:8000:8000"

  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      args:
        VISIONSET_UID: ${VISIONSET_UID:-1000}
        VISIONSET_GID: ${VISIONSET_GID:-1000}
    working_dir: /workspace
    user: "${VISIONSET_UID:-1000}:${VISIONSET_GID:-1000}"
    # So `up app` alone still brings up the API.
    depends_on:
      - api
    volumes:
      # Source directories, never package roots: mounting a package root buries the
      # image's node_modules. Manifests, tsconfigs, vite.config.ts and index.html are
      # baked into the image, so editing one needs `build`.
      - ../frontend/annotator/src:/workspace/frontend/annotator/src
      - ../frontend/ui-core/src:/workspace/frontend/ui-core/src
      - ../frontend/app/src:/workspace/frontend/app/src
      - ../frontend/app/public:/workspace/frontend/app/public
      - ../docker:/workspace/docker:ro
    environment:
      # Vite's own /api proxy, so http://localhost:5173 works without nginx.
      VISIONSET_API: http://api:8000
      # Bind mounts deliver no inotify events on macOS/Windows.
      CHOKIDAR_USEPOLLING: "true"
    command: sh /workspace/docker/app-dev.sh
    ports:
      - "127.0.0.1:5173:5173"

  # Beside nginx, not behind it: the docs deploy to their own host (see amplify.yml),
  # so they get their own port here too.
  docs:
    build:
      context: ..
      dockerfile: docker/docs.Dockerfile
      args:
        VISIONSET_UID: ${VISIONSET_UID:-1000}
        VISIONSET_GID: ${VISIONSET_GID:-1000}
    working_dir: /workspace/docs
    user: "${VISIONSET_UID:-1000}:${VISIONSET_GID:-1000}"
    volumes:
      - ../docs/content:/workspace/docs/content:ro
      # `src/`, not `docs/`, for the reason the app service gives; the projection into
      # src/content/ lands on the host too (git-ignored).
      - ../docs/src:/workspace/docs/src
      # Without it every page 404s on the favicon, invisibly to curl.
      - ../docs/public:/workspace/docs/public:ro
      - ../docker:/workspace/docker:ro
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh /workspace/docker/docs-dev.sh
    ports:
      # Every interface, like nginx: the docs are tested from other devices too.
      - "0.0.0.0:4321:4321"

  nginx:
    image: nginx:1.31-alpine
    depends_on:
      - api
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # 8080 because 80 needs root. Every interface, so another device on the network
      # can open the stack — and it is signed in too; see VISIONSET_UI_SESSION.
      - "0.0.0.0:8080:80"

  # Neither is wired to anything yet; somewhere to point a future adapter.
  postgres:
    profiles: ["postgres"]
    image: postgres:18
    environment:
      POSTGRES_DB: visionset
      POSTGRES_USER: visionset
      POSTGRES_PASSWORD: visionset
    ports:
      - "5432:5432"
    volumes:
      # The whole directory: from 18 the image keeps the cluster in a version
      # subdirectory and refuses a mount on the old `data/` path.
      - postgres-data:/var/lib/postgresql

  minio:
    profiles: ["minio"]
    # A release, never `latest`: a floating tag has no version to cool down.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: visionset
      MINIO_ROOT_PASSWORD: visionset
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
