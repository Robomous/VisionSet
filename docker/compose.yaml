# Development environment only. The release artifact is the pip package.
#
#   docker compose -f docker/compose.yaml up                # api + app
#   docker compose -f docker/compose.yaml --profile postgres up
#   docker compose -f docker/compose.yaml --profile minio up
#
# From a clean checkout this needs nothing installed on the host — no `uv sync`,
# no `pnpm install`, no `pnpm -r build`, no wheel. `up` builds the two images the
# first time; after that it starts them.
#
# Every dependency is resolved, downloaded and installed at **build** time, in
# docker/api.Dockerfile and docker/app.Dockerfile. Starting a container downloads
# nothing. After changing a dependency:
#
#   docker compose -f docker/compose.yaml build
#   docker compose -f docker/compose.yaml down -v && … up
#
# The `down -v` is not optional for a frontend dependency: node_modules lives in
# named volumes seeded from the image, and Docker seeds a volume only when it is
# new, so a rebuilt image cannot reach one that already has contents.
#
#   The app is at http://localhost:8080
#
# That is the only address anyone needs. nginx serves it: `/api/` reaches the API
# and everything else the vite dev server, so the browser sees one origin. The two
# services behind it are published as well (:8000 and :5173) for curl, an MCP
# client config, or reading a vite error without the proxy in the way — they are
# debugging doors, not the front one.
#
# First boot creates a workspace, mints a token and prints it in the `api` logs;
# sign in with it at http://localhost:8080.
#
# Storage — the same shape MLflow's default mode has, because it is the only shape
# VisionSet has: a local directory for files and SQLite for metadata, both inside
# one workspace directory, no server and nothing to configure. The kernel composes
# exactly one metadata store (`SqliteMetadataStore`, `visionset.db`) and one blob
# store (`FilesystemBlobStore`, `blobs/`). What this file adds is a *named* host
# directory for it, so the data is somewhere a person chose:
#
#   <repo>/workspace-data/          on the host   (git-ignored)
#   /data/                          in the api container
#   /data/dev/                      the workspace itself
#
# Point it elsewhere with VISIONSET_DATA, which is a host path and may be absolute:
#
#   VISIONSET_DATA=~/visionset docker compose -f docker/compose.yaml up
#
# It is a bind mount rather than a named volume precisely so `down -v` does not
# take the data with it.

# Named, rather than inherited from the directory. Compose derives a project name
# from the compose file's parent directory, which here is `docker` — a name any
# other checkout with a `docker/` directory also claims, so the two would share a
# network name and report each other's containers as orphans.
name: visionset

services:
  api:
    # Built, not pulled: every Python dependency is installed into the image, so
    # starting this service starts a server rather than resolving 53 packages
    # first. `docker/api.Dockerfile` says why each layer is where it is.
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace
      # The backend's storage, and the only mount here holding anything a person
      # would miss. Its default is inside the checkout — `**/workspace-data/` is
      # already git-ignored, so nothing written here can be committed by accident
      # — which means the host directory is visible twice in this container, once
      # as /data and once under /workspace. Same files either way; /data is the
      # one to think in, and the one that moves when VISIONSET_DATA is set.
      - ${VISIONSET_DATA:-../workspace-data}:/data
    environment:
      # Which workspace this server serves, inside the storage mount above.
      # `docker/api-dev.sh` creates it on first boot, because a stack whose every
      # protected route answers 500 until the reader knows to run `visionset init`
      # is not a dev environment.
      VISIONSET_WORKSPACE: /data/dev
    # Raw uvicorn rather than `visionset ui`, and deliberately so: that
    # command also serves the compiled bundle at /ui, which in development is
    # vite's job on :5173 — and building that bundle is exactly what this stack
    # exists to avoid needing.
    command: sh /workspace/docker/api-dev.sh
    ports:
      - "8000:8000"

  app:
    # Built, not pulled, for the reason `api` is: `pnpm install` belongs to a
    # build. See docker/app.Dockerfile.
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    working_dir: /workspace
    # Not for ordering — vite serves fine before the API answers, and the proxy
    # reconnects per request. It is so that `up app` alone still brings up the
    # thing the app is useless without.
    depends_on:
      - api
    volumes:
      - ..:/workspace
      # One volume per directory pnpm installed into during the image build.
      #
      # Two jobs, and it is worth separating them. First, they carry the build's
      # output past the bind mount: `..:/workspace` covers the whole tree, so
      # without these the host's `node_modules/` — or its absence — would shadow
      # what the image installed. Docker seeds a *new* named volume from the image
      # content at that path, which is what makes the install survive.
      #
      # Second, they keep the container off the host's tree. A macOS checkout holds
      # darwin-only native packages (esbuild, rollup, @tailwindcss/oxide,
      # lightningcss) that a Linux install would overwrite.
      #
      # pnpm's workspace layout puts a `node_modules/` at the root *and* in every
      # package, so each needs its own volume — a root-only volume would still let
      # the container write into `frontend/*/node_modules` on the host.
      #
      # Consequence worth knowing: these are seeded once, at creation. After
      # changing a dependency, `build` then `down -v` — a rebuilt image does not
      # reach a volume that already has contents.
      - app-node-modules:/workspace/node_modules
      - app-annotator-modules:/workspace/frontend/annotator/node_modules
      - app-ui-core-modules:/workspace/frontend/ui-core/node_modules
      - app-app-modules:/workspace/frontend/app/node_modules
      # Nothing installs at run time any more, so this is a guard rather than a
      # cache: pnpm relocates its store next to the project when its default is on
      # another filesystem, and a bind mount always is. Without it, a
      # `docker compose exec app pnpm …` would write `.pnpm-store/` into the host
      # checkout.
      - app-pnpm-store:/workspace/.pnpm-store
    environment:
      # Where vite's own `/api` proxy points. Requests arriving through nginx
      # never reach it — nginx has already routed `/api/` to the API by then — so
      # this is what makes http://localhost:5173 work as well as :8080. Without it
      # the config falls back to `http://127.0.0.1:8000`, which inside this
      # container is this container, and every API call dies at the proxy with a
      # connection refused that appears nowhere in the api logs.
      VISIONSET_API: http://api:8000
      # A bind mount does not deliver inotify events across the host boundary on
      # macOS or Windows, and vite's watcher is silent when it receives none:
      # edits simply never reach the browser, which reads as "HMR is broken"
      # rather than as a mount problem. Polling costs CPU, and is one reason
      # running the app on the host is still faster.
      CHOKIDAR_USEPOLLING: "true"
    command: sh /workspace/docker/app-dev.sh
    ports:
      - "5173:5173"

  # The front door, and the only port anybody needs: http://localhost:8080
  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - api
      - app
    volumes:
      # Read-only, because nothing should be able to rewrite the routing from
      # inside the container.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # 8080 rather than 80: 80 needs root on Linux to publish, and a dev stack
      # that has to be started with sudo is one nobody starts.
      - "8080:80"

  # Neither of the two below is wired to anything. The kernel composes exactly one
  # metadata store (`SqliteMetadataStore`) and one blob store
  # (`FilesystemBlobStore`), and no code anywhere reads a `DATABASE_URL` or an S3
  # endpoint — these exist to have somewhere to point a future adapter, which is
  # why they sit behind profiles and are off by default.
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_DB: visionset
      POSTGRES_USER: visionset
      POSTGRES_PASSWORD: visionset
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: visionset
      MINIO_ROOT_PASSWORD: visionset
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  app-node-modules:
  app-annotator-modules:
  app-ui-core-modules:
  app-app-modules:
  app-pnpm-store:
  postgres-data:
  minio-data:
