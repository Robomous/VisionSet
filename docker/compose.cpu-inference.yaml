# CPU inference for the dev stack (development only):
#
#   docker compose -f docker/compose.yaml -f docker/compose.cpu-inference.yaml up --build
#
# Suggestions on any host Docker runs on, at seconds instead of milliseconds. An override
# file rather than a profile, for the reason docker/compose.gpu.yaml gives, and `--build`
# on every switch between modes for the same reason. Nothing here reserves a device.

services:
  api:
    build:
      dockerfile: docker/api-cpu-inference.Dockerfile
