# The one hand-edited source for the VisionSet agent plugin. Every client file in this
# directory is generated from it by `python3 agent-plugins/tools/render_manifests.py`.
# The version is not written here: it is the repository `VERSION`, mapped to semver the
# same way the frontend packages map it.

[plugin]
name = "visionset"
display_name = "VisionSet"
description = "Create, curate and version computer-vision datasets through the local VisionSet MCP server."
publisher = "Robomous Inc."
license = "Apache-2.0"
homepage = "https://github.com/Robomous/VisionSet"
repository = "https://github.com/Robomous/VisionSet"
keywords = ["computer-vision", "datasets", "annotation", "mcp"]

[runtime]
# The distribution and console script the launcher runs as a subprocess. Nothing under
# agent-plugins/ imports it.
distribution = "visionset"
console_script = "visionset"
# The interpreter floor of runtime/, held equal to the distribution's `requires-python`.
requires_python = ">=3.11"
# "exact": an installation is compatible only at the bundle's own version.
compatibility = "exact"
launcher = "runtime/launch.py"
interpreter = "python3"

[clients]
adapters = ["claude-code", "codex"]
